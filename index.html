<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>results-almajd</title>

<style>
*{
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
margin:0;
background:#eef3f8;
}

.header{
background:#0b5fa5;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:500px;
margin:40px auto;
background:white;
border-radius:18px;
padding:30px;
box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.school{
text-align:center;
font-size:22px;
margin-bottom:10px;
font-weight:bold;
color:#333;
}

.branch{
text-align:center;
color:#666;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:1px solid #cfcfcf;
border-radius:10px;
font-size:17px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#0b5fa5;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:0.95;
}
</style>
</head>

<body>

<div class="header">
جمهورية العراق — وزارة التربية
</div>

<div class="container">
<div class="school">ثانوية المجد الأهلية للبنات</div>
<div class="branch">نتائج السادس الإعدادي — الفرع العلمي</div>

<input id="exam" placeholder="الرقم الامتحاني">
<input id="name" placeholder="الاسم الرباعي">

<button onclick="login()">بحث</button>
</div>

<script>
function login(){
let exam=document.getElementById("exam").value;
let name=document.getElementById("name").value;

if(exam==="192612321440109" &&
name.includes("دالي")){
window.location="results.html";
}else{
alert("البيانات غير صحيحة");
}
}
</script>

</body>
</html>
